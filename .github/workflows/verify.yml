name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cedar_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: cedar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cedar_test -d cedar_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: '1'
      CEDAR_MFA_KEY: 'AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE='
      POSTGRES_USER: cedar_test
      POSTGRES_PASSWORD: ci_only_password
      POSTGRES_DB: cedar_test
      POSTGRES_HOST: 127.0.0.1
      NEXT_PUBLIC_INQUIRY_MODE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python manage.py check && python manage.py makemigrations --check --dry-run && python manage.py test
        working-directory: backend
      - run: python manage.py spectacular --file /tmp/cedar-schema.yaml --validate
        working-directory: backend
      - run: node --experimental-strip-types scripts/generate-pricing.mjs --check
      - run: npm install && npm run check
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
