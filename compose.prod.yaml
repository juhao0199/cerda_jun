# Separate file, not an override of development compose.yaml.
x-backend-env: &backend-env
  DJANGO_DEBUG: '0'
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?required}
  CEDAR_MFA_KEY: ${CEDAR_MFA_KEY:?required}
  CEDAR_TRUST_EDGE: '1'
  SITE_ORIGIN: ${SITE_ORIGIN:?required}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?required}
  POSTGRES_DB: cedar_cursor
  POSTGRES_HOST: db
  POSTGRES_PORT: '5432'
  POSTGRES_SSLMODE: disable
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: cedar_cursor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?required}
      CEDAR_MIGRATOR_PASSWORD: ${CEDAR_MIGRATOR_PASSWORD:?required}
      CEDAR_RUNTIME_PASSWORD: ${CEDAR_RUNTIME_PASSWORD:?required}
    volumes:
      - prod_postgres:/var/lib/postgresql/data
      - ./infrastructure/postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cedar_cursor']
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build: ./backend
    environment:
      <<: *backend-env
      POSTGRES_USER: cedar_migrator
      POSTGRES_PASSWORD: ${CEDAR_MIGRATOR_PASSWORD:?required}
    command: ['sh','-ec','python manage.py migrate --noinput && python manage.py shell -c "from django.db import connection; connection.cursor().execute(open(\"/app/runtime-grants.sql\").read())"']
    volumes:
      - ./infrastructure/postgres/runtime-grants.sql:/app/runtime-grants.sql:ro
    depends_on:
      db: {condition: service_healthy}
    networks: [data]
  backend:
    build: ./backend
    environment:
      <<: *backend-env
      POSTGRES_USER: cedar_runtime
      POSTGRES_PASSWORD: ${CEDAR_RUNTIME_PASSWORD:?required}
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [data, api]
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
  frontend:
    build: ./frontend
    networks: [web]
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
  edge:
    image: nginx:stable-alpine
    ports: ['80:80','443:443']
    volumes:
      - ./infrastructure/nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    networks: [web, api]
    depends_on: [frontend, backend]
    restart: unless-stopped
networks:
  web: {}
  api: {internal: true}
  data: {internal: true}
volumes:
  prod_postgres: {}
