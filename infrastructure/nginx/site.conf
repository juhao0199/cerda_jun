# Replace studio.example.com with the real hostname; install valid TLS certs.
limit_req_zone $binary_remote_addr zone=cedar_auth:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=cedar_inquiry:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=cedar_crm:10m rate=120r/m;
limit_req_status 429;
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name studio.example.com;
    return 308 https://studio.example.com$request_uri;
}
server {
    listen 443 ssl default_server;
    server_name studio.example.com;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != studio.example.com) { return 444; }
    add_header Strict-Transport-Security 'max-age=31536000' always;
    server_tokens off;
    client_max_body_size 24k;
    client_body_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Cedar-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-Host '';
    proxy_hide_header Strict-Transport-Security;
    location = /api/inquiries {
        limit_req zone=cedar_inquiry burst=5 nodelay;
        proxy_pass http://backend:8000/api/v1/inquiries/;
    }
    location ~ ^/api/v1/auth/(login|password)/?$ {
        limit_req zone=cedar_auth burst=5 nodelay;
        rewrite ^/api/v1/auth/(login|password)/?$ /api/v1/auth/$1/ break;
        proxy_pass http://backend:8000;
    }
    location ~ ^/api/v1/(auth/(csrf|logout|me)|staff/(inquiries|security-events))/?$ {
        rewrite ^/api/v1/(auth/(csrf|logout|me)|staff/(inquiries|security-events))/?$ /api/v1/$1/ break;
        proxy_pass http://backend:8000;
    }
    location ~ "^/api/v1/staff/crm/(overview|leads(/[0-9a-fA-F-]{36})?|stage|notes|clients|assign|create|edit|archive|export)/?$" {
        limit_req zone=cedar_crm burst=30 nodelay;
        rewrite ^/api/v1/staff/crm/(.*[^/])/?$ /api/v1/staff/crm/$1/ break;
        proxy_pass http://backend:8000;
    }
    location ~ ^/api/v1/staff/team/action/?$ {
        limit_req zone=cedar_auth burst=5 nodelay;
        rewrite ^/api/v1/staff/team/action/?$ /api/v1/staff/team/action/ break;
        proxy_pass http://backend:8000;
    }
    location ~ ^/api/v1/staff/(team|security-center)/?$ {
        limit_req zone=cedar_crm burst=30 nodelay;
        rewrite ^/api/v1/staff/(team|security-center)/?$ /api/v1/staff/$1/ break;
        proxy_pass http://backend:8000;
    }
    location ~ "^/api/v1/staff/quotations/(catalog|list|create|change|detail/[0-9a-fA-F-]{36}|pdf/[0-9a-fA-F-]{36}/[0-9]+)/?$" {
        limit_req zone=cedar_crm burst=30 nodelay;
        rewrite ^/api/v1/staff/quotations/(.*[^/])/?$ /api/v1/staff/quotations/$1/ break;
        proxy_pass http://backend:8000;
    }
    # Only this authenticated endpoint accepts a body larger than 24 KB.
    location ~ ^/api/v1/staff/blog/cover/upload/?$ {
        client_max_body_size 5m;
        limit_req zone=cedar_inquiry burst=5 nodelay;
        rewrite ^/api/v1/staff/blog/cover/upload/?$ /api/v1/staff/blog/cover/upload/ break;
        proxy_pass http://backend:8000;
    }
    location ~ "^/api/v1/(staff|public)/blog/cover/[0-9a-f-]{36}/?$" {
        limit_req zone=cedar_crm burst=30 nodelay;
        rewrite ^/api/v1/(staff|public)/blog/cover/([^/]+)/?$ /api/v1/$1/blog/cover/$2/ break;
        proxy_pass http://backend:8000;
    }
    # Bounded rich-text JSON only; all other API limits remain unchanged.
    location ~ ^/api/v1/staff/blog/(create|change)/?$ {
        client_max_body_size 256k;
        limit_req zone=cedar_crm burst=30 nodelay;
        rewrite ^/api/v1/staff/blog/(create|change)/?$ /api/v1/staff/blog/$1/ break;
        proxy_pass http://backend:8000;
    }
    location ~ "^/api/v1/staff/blog/(list|detail/[a-z0-9-]{1,100}|revision/[a-z0-9-]{1,100}/[0-9]+|media/list|media/detail/[0-9a-f-]{36}|media/change|media/derive|terms/list|terms/change|seo/list|discovery/list|discovery/create|technical/policy|technical/policy/change|technical/history|technical/report/[0-9]{1,19}|technical/run)/?$" {
        limit_req zone=cedar_crm burst=30 nodelay;
        rewrite ^/api/v1/staff/blog/(.*[^/])/?$ /api/v1/staff/blog/$1/ break;
        proxy_pass http://backend:8000;
    }
    location /api/ { return 404; }
    location /internal/ { return 404; }
    location / {
        proxy_pass http://frontend:3000;
    }
}
