services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cedar_cursor}
      POSTGRES_USER: ${POSTGRES_USER:-cedar_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: ['python','manage.py','runserver','0.0.0.0:8000','--noreload']
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8000:8000'
volumes:
  postgres_data:
